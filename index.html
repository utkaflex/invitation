<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4eee6" />
    <meta name="description" content="Совсем скоро здесь появится кое-что особенное." />
    <title>Скоро здесь будет кое-что особенное</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="glow glow--top" aria-hidden="true"></div>
      <div class="glow glow--bottom" aria-hidden="true"></div>

      <section class="card" aria-labelledby="page-title">
        <div class="ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 32 32" role="presentation">
            <path d="M16 3c1.2 6.8 5.2 10.8 12 12-6.8 1.2-10.8 5.2-12 12-1.2-6.8-5.2-10.8-12-12C10.8 13.8 14.8 9.8 16 3Z" />
          </svg>
          <span></span>
        </div>

        <p class="eyebrow">Страница готовится</p>
        <h1 id="page-title">Совсем скоро<br />здесь будет <em>особенное</em></h1>
        <p class="description">
          Мы добавляем последние штрихи.<br />Загляните сюда немного позже.
        </p>

        <div class="loader" aria-label="Страница в процессе подготовки">
          <i></i><i></i><i></i>
        </div>

        <p class="footer">До скорой встречи</p>
      </section>
    </main>
  </body>
</html>
